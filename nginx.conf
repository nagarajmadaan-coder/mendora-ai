# nginx for the MENDORA frontend container.
#   /        → the built React app (with single-page-app fallback)
#   /api/    → the FastAPI backend container ("backend" on the Compose network)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;   # photo uploads (10 MB, base64-encoded)
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # AI diagnosis can take a while
    }

    # Hashed build files can be cached for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a screen of the React app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
